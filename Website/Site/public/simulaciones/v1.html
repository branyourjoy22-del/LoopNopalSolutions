<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V1 - Consola clasica - Cruce Sombrerete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #14171b;
    --panel: #1c2126;
    --panel-2: #21262c;
    --border: #2c333b;
    --text: #edeae3;
    --muted: #8b93a1;
    --verde: #3ddc84;
    --amarillo: #ffc145;
    --rojo: #ff5a5f;
    --naranja: #ff8a3d;
    --azul-bus: #4ea1ff;
    --pico-glow: #ff8a3d;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }

  .app{ max-width:1180px; margin:0 auto; padding:20px 20px 60px; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;
    padding:18px 22px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; margin-bottom:16px;
  }
  .titulo{ display:flex; flex-direction:column; gap:2px; }
  .titulo h1{ margin:0; font-size:1.15rem; font-weight:700; letter-spacing:.2px; }
  .titulo span{ color:var(--muted); font-size:.8rem; }
  .reloj-wrap{ display:flex; align-items:center; gap:14px; }
  .reloj{ font-size:2rem; font-weight:600; letter-spacing:1px; }
  .badge{
    padding:6px 12px; border-radius:999px; font-size:.75rem; font-weight:600;
    border:1px solid var(--border); color:var(--muted); background:var(--panel-2);
    white-space:nowrap;
  }
  .badge.pico{
    color:#1a1200; background:var(--pico-glow); border-color:var(--pico-glow);
    animation: pulso 1.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .badge.pico{ animation:none; } }
  @keyframes pulso{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }

  /* ---------- controls ---------- */
  .controles{
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
    padding:14px 18px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; margin-bottom:16px; font-size:.85rem;
  }
  .controles label{ color:var(--muted); display:flex; align-items:center; gap:6px; }
  button, input[type=time]{
    font-family:inherit; font-size:.85rem; color:var(--text);
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; cursor:pointer;
  }
  button:hover{ border-color:var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--azul-bus); outline-offset:2px;
  }
  button.activo{ border-color:var(--verde); color:var(--verde); }
  select{
    font-family:inherit; font-size:.85rem; color:var(--text);
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  }
  .separador{ width:1px; align-self:stretch; background:var(--border); margin:0 2px; }

  /* ---------- grid principal ---------- */
  .grid{ display:grid; grid-template-columns: 1.05fr 1.3fr; gap:16px; }
  @media (max-width: 880px){ .grid{ grid-template-columns:1fr; } }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:18px; overflow:hidden;
  }
  .panel h2{ margin:0 0 4px; font-size:.95rem; }
  .panel .sub{ margin:0 0 14px; color:var(--muted); font-size:.78rem; }

  /* ---------- esquema del cruce ---------- */
  #v3_schematic{ width:100%; height:auto; display:block; }
  .fase-actual{
    margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--panel-2);
    border:1px solid var(--border); font-size:.85rem; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .fase-actual b{ color:var(--text); }

  table.movs{ width:100%; border-collapse:collapse; margin-top:14px; font-size:.78rem; }
  table.movs th{ text-align:left; color:var(--muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--border); }
  table.movs td{ padding:6px 6px; border-bottom:1px solid #23282f; vertical-align:middle; }
  .luz-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
  .nivel{ padding:2px 8px; border-radius:999px; font-size:.68rem; font-weight:700; }

  /* ---------- gráfica ---------- */
  #v3_chartCanvas{ width:100%; height:auto; display:block; border-radius:10px; }
  .leyenda-chart{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:10px; font-size:.75rem; color:var(--muted); }
  .leyenda-chart span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:18px; height:0; border-top-width:3px; border-top-style:solid; display:inline-block; }
  .swatch.pico{ width:12px; height:12px; border-radius:3px; border:none; background:var(--pico-glow); opacity:.35; }

  footer.nota{
    margin-top:16px; color:var(--muted); font-size:.75rem; text-align:center; line-height:1.5;
  }

  /* ---------- shell / tabs (namespaced con prefijo sb-) ---------- */
  .sb-intro{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px 20px; margin-bottom:14px; font-size:.85rem; color:var(--muted); line-height:1.55;
  }
  .sb-intro b{ color:var(--text); }
  .sb-tabs{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;
  }
  .sb-tab-btn{
    font-family:'Space Grotesk', sans-serif; font-size:.82rem; font-weight:600; color:var(--muted);
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 16px; cursor:pointer;
  }
  .sb-tab-btn:hover{ border-color:var(--muted); color:var(--text); }
  .sb-tab-btn.activo{ border-color:var(--verde); color:var(--verde); background:var(--panel); }
  .sb-panel{ display:none; }
  .sb-panel.activo{ display:block; }

  .sb-term-wrap{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px;
  }
  .sb-term-controles{
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:14px; font-size:.85rem;
  }
  .sb-term-controles label{ color:var(--muted); display:flex; align-items:center; gap:6px; }
  .sb-terminal{
    background:#0e1013; border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size:.8rem; line-height:1.65; white-space:pre; overflow-x:auto; color:var(--text);
  }
  .c-verde{ color:var(--verde); font-weight:700; }
  .c-amarillo{ color:var(--amarillo); font-weight:700; }
  .c-rojo{ color:var(--rojo); font-weight:700; }
  .c-naranja{ color:var(--naranja); font-weight:700; }
  .sb-nota{ margin-top:14px; color:var(--muted); font-size:.75rem; text-align:center; line-height:1.5; }

</style>
</head>
<body>
<div class="app">

  <div class="sb-intro"><b>V1 - Version de consola clasica</b><br>Ciclo de 100 s, 6 fases.</div>
  <div class="sb-term-wrap">
    <div class="sb-term-controles">
      <button id="v1_btnPlay">⏸ Pausar</button>
      <label>Velocidad
        <select id="v1_velocidad">
          <option value="1.0">1.0 (tiempo real)</option>
          <option value="0.5" selected>0.5 (2x)</option>
          <option value="0.1">0.1 (demo, 10x)</option>
        </select>
      </label>
    </div>
    <div class="sb-terminal" id="v1_terminal"></div>
    <div id="v1_ciclo"></div>
  </div>

</div>
<script>

(function(){
  "use strict";
  const term = document.getElementById('v1_terminal');
  const cicloWrap = document.getElementById('v1_ciclo');
  const velSel = document.getElementById('v1_velocidad');
  const btnPlay = document.getElementById('v1_btnPlay');

  const VERDE='VERDE', AMARILLO='AMARILLO', ROJO='ROJO';
  const ICONO = {VERDE:'\u{1F7E2}', AMARILLO:'\u{1F7E1}', ROJO:'\u{1F534}'};
  const CLASE = {VERDE:'c-verde', AMARILLO:'c-amarillo', ROJO:'c-rojo'};

  const MOVIMIENTOS = [
    ['somb_n_izq',    'Av. Sombrerete \u2191  (giro izquierdo protegido)'],
    ['somb_n_frente', 'Av. Sombrerete \u2191  (de frente)'],
    ['somb_s_frente', 'Av. Sombrerete \u2193  (de frente)'],
    ['metrobus_n',    'Metrobus \u2191'],
    ['metrobus_s',    'Metrobus \u2193'],
    ['calle6',        'Calle 6'],
    ['praxedis',      'Av. Praxedis Guerrero'],
  ];
  const AGENDA = {
    somb_n_izq:    [[0,17,VERDE],[17,20,AMARILLO]],
    somb_n_frente: [[0,37,VERDE],[37,40,AMARILLO]],
    somb_s_frente: [[20,37,VERDE],[37,40,AMARILLO]],
    metrobus_n:    [[40,47,VERDE],[47,50,AMARILLO]],
    metrobus_s:    [[50,57,VERDE],[57,60,AMARILLO]],
    calle6:        [[60,77,VERDE],[77,80,AMARILLO]],
    praxedis:      [[80,97,VERDE],[97,100,AMARILLO]],
  };
  const FASES = [
    [0,20,  'F1 - Sombrerete con giro protegido'],
    [20,40, 'F2 - Sombrerete verde simultaneo'],
    [40,50, 'F3 - Metrobus norte'],
    [50,60, 'F4 - Metrobus sur'],
    [60,80, 'F5 - Calle 6'],
    [80,100,'F6 - Av. Praxedis Guerrero'],
  ];
  const CICLO_TOTAL = 100;

  function estadoDe(mov,t){
    for(const [ini,fin,color] of AGENDA[mov]){ if(t>=ini && t<fin) return color; }
    return ROJO;
  }
  function faseDe(t){
    for(const [ini,fin,nombre] of FASES){ if(t>=ini && t<fin) return nombre; }
    return FASES[FASES.length-1][2];
  }
  function pad(n){ return String(n).padStart(3,' '); }

  let t = 0, ciclo = 1, corriendo = true, timer = null;

  function render(){
    const filas = MOVIMIENTOS.map(([clave,etq])=>{
      const color = estadoDe(clave,t);
      return '  ' + ICONO[color] + '  ' + etq.padEnd(42,' ') + '<span class="'+CLASE[color]+'">'+color+'</span>';
    }).join('\n');
    term.innerHTML =
'============================================================\n'+
'  Cruce Av. Sombrerete - Calle 6 - Av. Praxedis Guerrero\n'+
'============================================================\n'+
'  Segundo del ciclo: '+pad(t)+' / '+CICLO_TOTAL+'\n'+
'  Fase activa:       '+faseDe(t)+'\n'+
'------------------------------------------------------------\n'+
filas+'\n'+
'============================================================\n'+
'  Ciclo '+ciclo;
  }

  function tick(){
    t++;
    if(t>=CICLO_TOTAL){ t=0; ciclo++; }
    render();
  }

  function velocidadMs(){ return parseFloat(velSel.value)*1000; }

  function arrancar(){
    clearInterval(timer);
    timer = setInterval(tick, velocidadMs());
  }

  velSel.addEventListener('change', ()=>{ if(corriendo) arrancar(); });
  btnPlay.addEventListener('click', ()=>{
    corriendo = !corriendo;
    btnPlay.textContent = corriendo ? '\u23F8 Pausar' : '\u25B6 Reanudar';
    if(corriendo) arrancar(); else clearInterval(timer);
  });

  render();
  arrancar();
})();

</script>
</body>
</html>
