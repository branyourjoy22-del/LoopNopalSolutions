; Proyecto: Control automatizado de tinaco.
; Placa: ESP32-C3 Supermini


[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
 
upload_protocol = esptool

; change microcontroller
board_build.mcu = esp32c3

; change MCU frequency
board_build.f_cpu = 160000000L

; El ESP32-C3 Supermini usa el puerto USB nativo del chip (no un chip
; serie externo), así que estas dos banderas son necesarias para que
; el Serial Monitor funcione correctamente.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
